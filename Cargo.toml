[workspace]
resolver = "2"
members = [
    "crates/pe-edit",
    "crates/pe-edit-cli",
    "crates/pe-edit-gui",
    "crates/pe-gui-common",
    "crates/pe-scylla",
    "crates/pe-scylla-cli",
    "crates/pe-scylla-gui",
    "crates/sim-target",
    "crates/std-target",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["aphage"]
repository = "https://github.com/aphage/pe-rs"
rust-version = "1.85"

[workspace.dependencies]
thiserror = "2"

# sim-target's bin is no_std (no unwinder available), so panics abort. The rest
# of the workspace is unaffected functionally; test failures just report as a
# process abort instead of a per-test panic message.
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
