[package]
name = "pe-gui-common"
description = "Shared GUI utilities for the pe-rs editors: i18n (rust-i18n locales + system-language auto-detect), CJK fonts, persisted language setting."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[dependencies]
rust-i18n = "4"
sys-locale = "0.3"
egui = { version = "0.36.0", default-features = false, features = ["default_fonts"] }
