[package]
name = "sim-target"
description = "Simulation target that corrupts its own in-memory PE per docs/dump scenarios, then pauses for a standalone pe dump tool to dump, fix and re-run it."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

# The bin is no_std / no-CRT: it corrupts itself with raw Win32 FFI. The
# standalone dump tool lives in pe-rs (`examples/dump.rs`); this crate only
# provides the target and an end-to-end test that drives it like that tool.
[dependencies]

[dev-dependencies]
pe-rs = { path = "../pe-rs" }

# The no_std bin can't be built as a test target (the test harness links std,
# clashing with the panic handler). It has no unit tests anyway.
[[bin]]
name = "sim-target"
path = "src/main.rs"
test = false
