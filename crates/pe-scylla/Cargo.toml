[package]
name = "pe-scylla"
description = "Process operation + dump library (Scylla benchmark): attach to a debugged process, dump its PE image into pe-edit's model, scan and fix the IAT (resolver / code-reference / reflection), rebase the dump, trace API hooks."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
homepage = "https://github.com/aphage/pe-rs"
documentation = "https://docs.rs/pe-scylla"
keywords = ["dump", "iat-fix", "process", "reverse-engineering", "windows"]
categories = ["development-tools"]

[dependencies]
pe-edit = { path = "../pe-edit", version = "0.1.0" }
iced-x86 = "1.21.0"
thiserror.workspace = true
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
] }

[dev-dependencies]
